<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Local API - Ward 29 Portal</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
        .news-item { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 4px; }
        .error { color: red; }
        .success { color: green; }
        .login-form { background: #f5f5f5; padding: 20px; border-radius: 4px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Ward 29 DNCC Portal - Local API Test</h1>
    
    <div id="loginSection" class="login-form">
        <h2>Admin Login</h2>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" value="admin@ward29.com">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" value="Admin123!">
        </div>
        <button onclick="login()">Login</button>
        <div id="loginStatus"></div>
    </div>

    <div id="newsSection" style="display: none;">
        <h2>News Management</h2>
        
        <h3>Add News</h3>
        <form id="newsForm">
            <div class="form-group">
                <label>Title (English):</label>
                <input type="text" id="title_en" required>
            </div>
            <div class="form-group">
                <label>Title (Bangla):</label>
                <input type="text" id="title_bn" required>
            </div>
            <div class="form-group">
                <label>Content (English):</label>
                <textarea id="content_en" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Content (Bangla):</label>
                <textarea id="content_bn" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Image:</label>
                <input type="file" id="image" accept="image/*">
            </div>
            <button type="submit">Add News</button>
        </form>

        <h3>Existing News</h3>
        <button onclick="loadNews()">Refresh News</button>
        <div id="newsList"></div>
        
        <button onclick="logout()">Logout</button>
    </div>

    <script>
        let authToken = localStorage.getItem('authToken');

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('loginStatus');

            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    authToken = data.token;
                    localStorage.setItem('authToken', authToken);
                    localStorage.setItem('adminUser', JSON.stringify(data.user));
                    
                    statusDiv.innerHTML = '<div class="success">Login successful!</div>';
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('newsSection').style.display = 'block';
                    loadNews();
                } else {
                    statusDiv.innerHTML = '<div class="error">Login failed</div>';
                }
            } catch (error) {
                statusDiv.innerHTML = '<div class="error">Error: ' + error.message + '</div>';
            }
        }

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('adminUser');
            authToken = null;
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('newsSection').style.display = 'none';
        }

        async function loadNews() {
            try {
                const response = await fetch('http://localhost:3000/api/news');
                const news = await response.json();
                
                const newsList = document.getElementById('newsList');
                newsList.innerHTML = '';
                
                news.forEach(item => {
                    const newsDiv = document.createElement('div');
                    newsDiv.className = 'news-item';
                    newsDiv.innerHTML = `
                        <h4>${item.title_en} / ${item.title_bn}</h4>
                        <p>${item.content_en}</p>
                        <p><small>${item.content_bn}</small></p>
                        ${item.image ? `<img src="${item.image}" width="200" style="max-width: 100%; height: auto;">` : ''}
                        <br>
                        <button onclick="deleteNews(${item.id})">Delete</button>
                    `;
                    newsList.appendChild(newsDiv);
                });
            } catch (error) {
                console.error('Error loading news:', error);
            }
        }

        async function deleteNews(id) {
            if (!confirm('Are you sure you want to delete this news?')) return;
            
            try {
                const response = await fetch(`http://localhost:3000/api/news/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (response.ok) {
                    loadNews();
                    alert('News deleted successfully');
                } else {
                    alert('Failed to delete news');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        document.getElementById('newsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('title_en', document.getElementById('title_en').value);
            formData.append('title_bn', document.getElementById('title_bn').value);
            formData.append('content_en', document.getElementById('content_en').value);
            formData.append('content_bn', document.getElementById('content_bn').value);
            
            const imageFile = document.getElementById('image').files[0];
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                const response = await fetch('http://localhost:3000/api/news', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` },
                    body: formData
                });

                if (response.ok) {
                    document.getElementById('newsForm').reset();
                    loadNews();
                    alert('News added successfully!');
                } else {
                    const error = await response.json();
                    alert('Failed to add news: ' + error.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        // Check if already logged in
        if (authToken) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('newsSection').style.display = 'block';
            loadNews();
        }
    </script>
</body>
</html>
